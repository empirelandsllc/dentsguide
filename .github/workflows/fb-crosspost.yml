name: Daily deal to Facebook page

on:
  schedule:
    - cron: "17 17 * * *"   # 19:17 Israel (winter time)
  workflow_dispatch:

permissions:
  contents: write

concurrency: fb-crosspost

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - name: Post newest deal
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python tools/fb_crosspost.py
      - name: Save state
        run: |
          if ! git diff --quiet -- tools/fb_state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898519+github-actions[bot]@users.noreply.github.com"
            git add tools/fb_state.json
            git commit -m "fb crosspost state [skip ci]"
            git push
          fi
